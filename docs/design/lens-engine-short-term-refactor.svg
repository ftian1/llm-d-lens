<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">Lens Engine — Short-term Refactor Architecture</title>
  <desc id="desc">A stable namespace-scoped Lens engine organized as API, domain kernel, capabilities, ports, adapters, and external systems.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px sans-serif;fill:#0f172a}.subtitle{font:16px sans-serif;fill:#475569}.layer{font:700 17px sans-serif;fill:#0f172a}.head{font:700 19px sans-serif;fill:#0f172a}.body{font:14px sans-serif;fill:#334155}.small{font:13px sans-serif;fill:#475569}.box{stroke:#94a3b8;stroke-width:1.5}.stable{fill:#eef2ff;stroke:#4f46e5}.kernel{fill:#ecfdf5;stroke:#059669}.cap{fill:#fffbeb;stroke:#d97706}.port{fill:#ecfeff;stroke:#0891b2}.adapter{fill:#f1f5f9;stroke:#64748b}.external{fill:#fff;stroke:#94a3b8}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1500" fill="#ffffff"/>
  <text x="60" y="58" class="title">Lens Engine — Short-term Refactor Architecture</text>
  <text x="60" y="88" class="subtitle">Stable API and domain kernel for namespace-scoped llm-d operations</text>

  <rect x="40" y="120" width="1520" height="120" rx="14" class="box external"/>
  <text x="65" y="150" class="layer">Consumers</text>
  <g transform="translate(65 170)"><rect width="260" height="50" rx="8" class="box external"/><text x="130" y="30" text-anchor="middle" class="body">CLI / llmd</text></g>
  <g transform="translate(350 170)"><rect width="260" height="50" rx="8" class="box external"/><text x="130" y="30" text-anchor="middle" class="body">REST / MCP</text></g>
  <g transform="translate(635 170)"><rect width="260" height="50" rx="8" class="box external"/><text x="130" y="30" text-anchor="middle" class="body">In-cluster Job</text></g>
  <g transform="translate(920 170)"><rect width="260" height="50" rx="8" class="box external"/><text x="130" y="30" text-anchor="middle" class="body">Backend / Dashboard</text></g>
  <g transform="translate(1205 170)"><rect width="300" height="50" rx="8" class="box external"/><text x="150" y="30" text-anchor="middle" class="body">CI / Automation</text></g>

  <rect x="40" y="270" width="1520" height="180" rx="14" class="box stable"/>
  <text x="65" y="302" class="layer">lens.api — the only external contract</text>
  <text x="65" y="328" class="small">Versioned request, result, error, and schema models; consumers never call adapters directly.</text>
  <g transform="translate(100 360)"><rect width="260" height="60" rx="9" class="box stable"/><text x="130" y="28" text-anchor="middle" class="head">Intent</text><text x="130" y="48" text-anchor="middle" class="small">desired state / action</text></g>
  <g transform="translate(440 360)"><rect width="260" height="60" rx="9" class="box stable"/><text x="130" y="28" text-anchor="middle" class="head">Plan</text><text x="130" y="48" text-anchor="middle" class="small">reviewable difference + digest</text></g>
  <g transform="translate(780 360)"><rect width="260" height="60" rx="9" class="box stable"/><text x="130" y="28" text-anchor="middle" class="head">Operation</text><text x="130" y="48" text-anchor="middle" class="small">execute / track / recover</text></g>
  <g transform="translate(1120 360)"><rect width="300" height="60" rx="9" class="box stable"/><text x="150" y="28" text-anchor="middle" class="head">InstanceStatus</text><text x="150" y="48" text-anchor="middle" class="small">observed health and lifecycle</text></g>

  <rect x="40" y="480" width="745" height="270" rx="14" class="box kernel"/>
  <text x="65" y="514" class="layer">Domain Kernel — stable business rules</text>
  <g transform="translate(65 540)"><rect width="320" height="78" rx="9" class="box kernel"/><text x="18" y="28" class="head">Planning</text><text x="18" y="52" class="body">Intent → Plan; policy and digest</text></g>
  <g transform="translate(420 540)"><rect width="320" height="78" rx="9" class="box kernel"/><text x="18" y="28" class="head">Lifecycle</text><text x="18" y="52" class="body">apply, teardown, ownership</text></g>
  <g transform="translate(65 640)"><rect width="320" height="78" rx="9" class="box kernel"/><text x="18" y="28" class="head">Observation</text><text x="18" y="52" class="body">health, drift, workload status</text></g>
  <g transform="translate(420 640)"><rect width="320" height="78" rx="9" class="box kernel"/><text x="18" y="28" class="head">Operation</text><text x="18" y="52" class="body">steps, progress, state transitions</text></g>
  <text x="65" y="742" class="small">InstanceRecord · RolloutRecord · Policy · Ownership · State transitions</text>

  <rect x="815" y="480" width="745" height="270" rx="14" class="box cap"/>
  <text x="840" y="514" class="layer">Capabilities — pluggable domain knowledge</text>
  <g transform="translate(840 540)"><rect width="320" height="78" rx="9" class="box cap"/><text x="18" y="28" class="head">Variants</text><text x="18" y="52" class="body">guide.yaml semantics and modes</text></g>
  <g transform="translate(1195 540)"><rect width="320" height="78" rx="9" class="box cap"/><text x="18" y="28" class="head">Kinds</text><text x="18" y="52" class="body">workload and resource knowledge</text></g>
  <g transform="translate(840 640)"><rect width="320" height="78" rx="9" class="box cap"/><text x="18" y="28" class="head">Checks</text><text x="18" y="52" class="body">namespace policy and preflight</text></g>
  <g transform="translate(1195 640)"><rect width="320" height="78" rx="9" class="box cap"/><text x="18" y="28" class="head">Workflows</text><text x="18" y="52" class="body">rollout, import, scale, migrate</text></g>

  <rect x="40" y="790" width="1520" height="190" rx="14" class="box port"/>
  <text x="65" y="824" class="layer">Ports — interfaces required by the kernel</text>
  <g transform="translate(65 850)"><rect width="260" height="78" rx="9" class="box port"/><text x="18" y="30" class="head">ClusterAccess</text><text x="18" y="54" class="small">namespace-scoped resources</text></g>
  <g transform="translate(350 850)"><rect width="260" height="78" rx="9" class="box port"/><text x="18" y="30" class="head">InstanceRepository</text><text x="18" y="54" class="small">ConfigMap inventory source of truth</text></g>
  <g transform="translate(635 850)"><rect width="260" height="78" rx="9" class="box port"/><text x="18" y="30" class="head">StackRenderer</text><text x="18" y="54" class="small">guide / Helm / Kustomize</text></g>
  <g transform="translate(920 850)"><rect width="260" height="78" rx="9" class="box port"/><text x="18" y="30" class="head">CapabilityProbe</text><text x="18" y="54" class="small">discovery and cluster facts</text></g>
  <g transform="translate(1205 850)"><rect width="300" height="78" rx="9" class="box port"/><text x="18" y="30" class="head">Observer / Auth / Discovery</text><text x="18" y="54" class="small">workloads, permissions, APIs</text></g>

  <rect x="40" y="1020" width="1520" height="190" rx="14" class="box adapter"/>
  <text x="65" y="1054" class="layer">Adapters — technical implementations</text>
  <g transform="translate(65 1080)"><rect width="330" height="78" rx="9" class="box adapter"/><text x="18" y="30" class="head">Kubernetes / OpenShift</text><text x="18" y="54" class="small">kubectl · oc · Kubernetes REST</text></g>
  <g transform="translate(430 1080)"><rect width="330" height="78" rx="9" class="box adapter"/><text x="18" y="30" class="head">ConfigMap Instance Store</text><text x="18" y="54" class="small">inventory.json and ownership checks</text></g>
  <g transform="translate(795 1080)"><rect width="330" height="78" rx="9" class="box adapter"/><text x="18" y="30" class="head">Rendering / Sources</text><text x="18" y="54" class="small">Helm · Kustomize · Git</text></g>
  <g transform="translate(1160 1080)"><rect width="340" height="78" rx="9" class="box adapter"/><text x="18" y="30" class="head">Policy / Probe Implementations</text><text x="18" y="54" class="small">SSAR, discovery, workload observation</text></g>

  <rect x="40" y="1250" width="1520" height="110" rx="14" class="box external"/>
  <text x="65" y="1284" class="layer">External systems</text>
  <text x="65" y="1315" class="body">Kubernetes / OpenShift API</text><text x="360" y="1315" class="body">Source repositories</text><text x="650" y="1315" class="body">Helm and Kustomize tools</text><text x="1010" y="1315" class="body">Namespace resources</text>
  <rect x="40" y="1390" width="1520" height="65" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="65" y="1418" class="head">Scope boundary</text><text x="230" y="1418" class="body">Namespace-scoped engine · ConfigMap inventory is authoritative · cluster-scoped objects and cluster provisioning are outside the current core.</text>

  <path d="M195 220 V270 M480 220 V270 M765 220 V270 M1050 220 V270 M1355 220 V270" class="arrow"/>
  <path d="M230 450 V480 M670 450 V480 M1030 450 V480 M1300 450 V480" class="arrow"/>
  <path d="M410 750 V790 M1120 750 V790" class="arrow"/>
  <path d="M220 980 V1020 M595 980 V1020 M925 980 V1020 M1330 980 V1020" class="arrow"/>
  <path d="M230 1210 V1250 M595 1210 V1250 M960 1210 V1250 M1330 1210 V1250" class="arrow"/>
</svg>
